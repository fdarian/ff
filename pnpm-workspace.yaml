packages:
  - apps/*
  - packages/*
  - internals/*

catalog:
  tsrs: ^0.18.0-ts7.1.0-dev.20260929

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
  msw: false
  protobufjs: true

packageExtensions:
  bun-types:
    dependencies:
      undici-types: '^6.20.0'

enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.61'
  - ai@7.0.76
